name: parse2publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'release-manifest.json'
      - 'release-baseline.json'
      - 'acceptance/evidence/**'
      - 'src/**'
      - '.github/workflows/parse2publish.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'release-manifest.json'
      - 'release-baseline.json'
      - 'acceptance/evidence/**'
      - 'src/**'
      - '.github/workflows/parse2publish.yaml'

permissions:
  contents: read

concurrency:
  group: release-repository-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      # 签出当前仓库
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装依赖
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      # 没有准入源、证据过期或 hash 不一致都会中止；不得部署空仓库。
      - name: Check device evidence and package approved sources
        run: uv run ebjer release --source-dir extensions --manifest release-manifest.json --to repository/v2 --max-age-days 7

      # PR 只验证产物；严格验收成功后才签出可写 website 仓库。
      - name: Checkout website repo
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: easybangumiorg/website
          path: website
          token: ${{ secrets.TOKEN }}
          ref: main

      # 部署文件
      - name: Deploy files
        if: github.event_name != 'pull_request'
        run: |
          rm -rf website/src/public/repository/v2/ || true
          mkdir -p website/src/public/repository/v2/
          cp -r repository/v2/* website/src/public/repository/v2/
        
      # 创建提交并推送
      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          cd website
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/public/repository/v2/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update repository from CommunityJsExtensionEasyBangumi"
            git push origin main
          fi
