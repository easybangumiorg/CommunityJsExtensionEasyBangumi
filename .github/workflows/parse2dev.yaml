name: parse2dev

# main 必须经过 PR；索引与源一起提交，CI 只验证，不用 bot 绕过保护回推。
on:
  push:
    branches: [main]
    paths:
      - 'dev-extensions/**'
      - 'channel/dev/**'
      - 'src/**'
      - '.github/workflows/parse2dev.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-channel-publish
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Verify committed dev index and remote source bytes
        run: uv run ebjer channel-check --source-dir dev-extensions --index channel/dev/index.jsonl --verify
